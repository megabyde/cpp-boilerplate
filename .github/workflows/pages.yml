name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: doxygen / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tool pins (CONAN_VERSION, DOXYGEN_VERSION) live in .github/ci.env, shared
      # across workflows.
      - name: Load CI env
        run: cat .github/ci.env >> "$GITHUB_ENV"
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          cache_packages: true
      - name: Install Doxygen
        run: |
          version="${{ env.DOXYGEN_VERSION }}"
          curl -sL "https://github.com/doxygen/doxygen/releases/download/Release_${version//./_}/doxygen-${version}.linux.bin.tar.gz" | tar -xz
          echo "$PWD/doxygen-${version}/bin" >> "$GITHUB_PATH"
      - run: make docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html

  deploy:
    name: deploy / github-pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
