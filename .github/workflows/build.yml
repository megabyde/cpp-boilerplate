name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.preset }} / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      WARNINGS_AS_ERRORS: ON
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [release, sanitize]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: conan-${{ matrix.os }}-${{ matrix.compiler }}-
      - uses: conan-io/setup-conan@v1
      - name: Verify conan.lock freshness
        run: |
          conan lock create . -pr=profiles/default --lockfile-out=/tmp/fresh.lock
          diff conan.lock /tmp/fresh.lock
      - run: make bootstrap
      - if: matrix.preset == 'sanitize'
        run: make bootstrap-sanitize
      - run: make ${{ matrix.preset }}

  # Windows has no make; it drives Conan and the CMake presets directly, using the
  # MSVC environment Conan generates (conanbuild.bat) rather than a third-party
  # action. The sanitize and coverage presets are Unix-only, so Windows covers release.
  windows:
    name: release / windows-latest / msvc
    runs-on: windows-latest
    env:
      WARNINGS_AS_ERRORS: ON
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-windows-latest-msvc-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: conan-windows-latest-msvc-
      - uses: conan-io/setup-conan@v1
      # Ninja must be on PATH when Conan picks the generator at install time.
      - run: pip install ninja
      - run: conan install . -pr=profiles/default -s build_type=Release --build=missing --lockfile=conan.lock
      - name: Build and test (release preset)
        shell: cmd
        run: |
          call build\release\generators\conanbuild.bat
          cmake --workflow --preset release || exit /b 1

  coverage:
    name: coverage / ubuntu-latest / gcc
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
      WARNINGS_AS_ERRORS: ON
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-ubuntu-latest-gcc-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: conan-ubuntu-latest-gcc-
      - uses: conan-io/setup-conan@v1
      - run: python3 -m pip install --break-system-packages --user gcovr
      - run: make bootstrap
      # Builds, runs the suite, and fails if line coverage drops below the floor.
      - run: make coverage-report
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/coverage-report/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conan-io/setup-conan@v1
      - run: make bootstrap
      - run: make format-check
      - run: make lint
