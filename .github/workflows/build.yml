name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned tool versions for reproducible CI. Bump here in one place.
  CONAN_VERSION: "2.29.1"
  CLANG_FORMAT_VERSION: "21.1.8"
  CLANG_TIDY_VERSION: "21.1.6"
  CMAKELANG_VERSION: "0.6.13"

jobs:
  build:
    name: ${{ matrix.preset }} / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug, release, sanitize]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc

    steps:
      - uses: actions/checkout@v7
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          cache_packages: true
      - name: Install ccache
        run: ${{ runner.os == 'macOS' && 'brew install ccache' || 'sudo apt-get install -y ccache' }}
      # Rolling cache key: actions/cache saves only on an exact-key miss, so the run_id
      # suffix makes every run save an updated cache while restore-keys warm-starts
      # from the newest previous one.
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.preset }}-
      - run: make lock-check
      - run: make bootstrap
      - if: matrix.preset == 'sanitize'
        run: make bootstrap-sanitize
      - run: make ${{ matrix.preset }}
      - name: ccache stats
        run: ccache -sv
      # Install the application to a throwaway prefix and run it, verifying the install() rule.
      - name: Verify install (release)
        if: matrix.preset == 'release'
        run: |
          cmake --install build/release --prefix "$RUNNER_TEMP/install"
          "$RUNNER_TEMP/install/bin/cpp_boilerplate"

  # Windows has no make; it drives Conan and the CMake presets directly. The Visual
  # Studio generator (selected by conanfile.py on Windows) locates MSVC itself, so no
  # vcvars environment or third-party action is needed. The sanitize and coverage
  # presets are Unix-only, so Windows covers release.
  windows:
    name: release / windows-latest / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          cache_packages: true
      - name: Install dependencies (release)
        run: conan install . -pr=profiles/default -s build_type=Release --build=missing --lockfile=conan.lock
      - name: Build and test (release preset)
        run: cmake --workflow --preset release
      - name: Verify install (release)
        shell: cmd
        run: |
          cmake --install build\release --prefix "%RUNNER_TEMP%\install" || exit /b 1
          "%RUNNER_TEMP%\install\bin\cpp_boilerplate.exe" || exit /b 1

  coverage:
    name: coverage / ubuntu-latest / gcc
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    steps:
      - uses: actions/checkout@v7
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          cache_packages: true
      - run: sudo apt-get install -y ccache
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-coverage-${{ github.run_id }}
          restore-keys: ccache-coverage-
      - run: python3 -m pip install --break-system-packages --user gcovr
      - run: make bootstrap
      # Builds, runs the suite, and fails if line coverage drops below the floor.
      - run: make coverage-report
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage/coverage-report/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          cache_packages: true
      # ~/.local/bin precedes /usr/bin on the runner, so these shadow the image's
      # unpinned clang-format/clang-tidy.
      - name: Pin lint toolchain
        run: |
          python3 -m pip install --break-system-packages --user \
            clang-format==${{ env.CLANG_FORMAT_VERSION }} \
            clang-tidy==${{ env.CLANG_TIDY_VERSION }} \
            cmakelang==${{ env.CMAKELANG_VERSION }}
      - run: make bootstrap
      - run: make format-check
      - run: make lint
