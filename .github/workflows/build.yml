name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the Conan version for reproducible CI. Bump here in one place.
  CONAN_VERSION: "2.29.1"

jobs:
  build:
    name: ${{ matrix.preset }} / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      WARNINGS_AS_ERRORS: ON
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [release, sanitize]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc

    steps:
      - uses: actions/checkout@v4
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          cache_packages: true
      - run: make lock-check
      - run: make bootstrap
      - if: matrix.preset == 'sanitize'
        run: make bootstrap-sanitize
      - run: make ${{ matrix.preset }}
      # Install the application to a throwaway prefix and run it, verifying the install() rule.
      - name: Verify install (release)
        if: matrix.preset == 'release'
        run: |
          cmake --install build/release --prefix "$RUNNER_TEMP/install"
          "$RUNNER_TEMP/install/bin/cpp_boilerplate"

  # Windows has no make; it drives Conan and the CMake presets directly, using the
  # MSVC environment Conan generates (conanbuild.bat) rather than a third-party
  # action. The sanitize and coverage presets are Unix-only, so Windows covers release.
  windows:
    name: release / windows-latest / msvc
    runs-on: windows-latest
    env:
      WARNINGS_AS_ERRORS: ON
    steps:
      - uses: actions/checkout@v4
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          cache_packages: true
      # Ninja must be on PATH when Conan picks the generator at install time.
      - run: pip install ninja
      - run: conan install . -pr=profiles/default -s build_type=Release --build=missing --lockfile=conan.lock
      - name: Build and test (release preset)
        shell: cmd
        run: |
          call build\release\generators\conanbuild.bat
          cmake --workflow --preset release || exit /b 1
      - name: Verify install (release)
        shell: cmd
        run: |
          cmake --install build\release --prefix "%RUNNER_TEMP%\install" || exit /b 1
          "%RUNNER_TEMP%\install\bin\cpp_boilerplate.exe" || exit /b 1

  coverage:
    name: coverage / ubuntu-latest / gcc
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
      WARNINGS_AS_ERRORS: ON
    steps:
      - uses: actions/checkout@v4
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          cache_packages: true
      - run: python3 -m pip install --break-system-packages --user gcovr
      - run: make bootstrap
      # Builds, runs the suite, and fails if line coverage drops below the floor.
      - run: make coverage-report
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/coverage-report/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          cache_packages: true
      - run: make bootstrap
      - run: make format-check
      - run: make lint
